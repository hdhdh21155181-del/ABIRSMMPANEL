<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - ABIR SMM PANEL</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #080e1c;
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.register-box {
  width: 100%;
  max-width: 420px;
  background: #15243b;
  border: 1px solid #293954;
  border-radius: 18px;
  padding: 30px 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.logo {
  text-align: center;
  color: #00d6a0;
  font-size: 27px;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #b9c3d5;
  margin-bottom: 25px;
}

h2 {
  text-align: center;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #dce5f2;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 18px;
  background: #080e1c;
  color: white;
  border: 1px solid #35445d;
  border-radius: 9px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #00d6a0;
}

button {
  width: 100%;
  padding: 15px;
  background: #00d6a0;
  color: #071322;
  border: none;
  border-radius: 9px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.login {
  text-align: center;
  margin-top: 23px;
  color: #b9c3d5;
}

a {
  color: #00d6a0;
  text-decoration: none;
  font-weight: bold;
}

.home {
  display: block;
  text-align: center;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="register-box">

  <h1 class="logo">ABIR SMM</h1>
  <p class="subtitle">Create Your Account</p>

  <h2>Customer Registration</h2>

  <form onsubmit="event.preventDefault(); alert('Registration is not connected yet.');">

    <label>Full Name</label>
    <input type="text" placeholder="Enter your full name" required>

    <label>Email Address</label>
    <input type="email" placeholder="Enter your email" required>

    <label>Mobile Number</label>
    <input type="tel" placeholder="Enter your mobile number" required>

    <label>Password</label>
    <input type="password" placeholder="Create a password" minlength="8" required>

    <label>Confirm Password</label>
    <input type="password" placeholder="Confirm your password" minlength="8" required>

    <button type="submit">Create Account</button>

  </form>

  <p class="login">
    Already have an account?
    <a href="login.html">Login Now</a>
  </p>

  <a class="home" href="index.html">← Back to Home</a>

</div>

</body>
</html>
